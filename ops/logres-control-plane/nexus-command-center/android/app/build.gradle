plugins {
    id 'com.android.application'
}

android {
    namespace 'com.nexuscore.commandcenter'
    compileSdk 36

    defaultConfig {
        applicationId 'com.nexuscore.commandcenter'
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName '1.0.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation 'androidx.activity:activity:1.11.0'
}
