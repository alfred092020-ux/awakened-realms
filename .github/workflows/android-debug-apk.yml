name: Build Android APKs

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Build web game
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Restore stable Android debug keystore
        shell: bash
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$HOME/.android"
          printf '%s' "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"

      - name: Verify Android signing fingerprint
        run: |
          keytool -list -v             -keystore "$HOME/.android/debug.keystore"             -alias androiddebugkey             -storepass android             -keypass android             | grep "SHA1:"

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build debug and release APKs
        working-directory: android
        run: ./gradlew assembleDebug assembleRelease --no-daemon

      - name: Verify debug and release APKs exist
        run: |
          test -f android/app/build/outputs/apk/debug/app-debug.apk
          test -f android/app/build/outputs/apk/release/app-release-unsigned.apk
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android/app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Capture APK checksums
        run: |
          sha256sum android/app/build/outputs/apk/debug/app-debug.apk > android/app/build/outputs/apk/debug/app-debug.apk.sha256
          sha256sum android/app/build/outputs/apk/release/app-release-unsigned.apk > android/app/build/outputs/apk/release/app-release-unsigned.apk.sha256

      - name: Upload Android APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: awakened-realms-android-apks
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/app-debug.apk.sha256
            android/app/build/outputs/apk/release/app-release-unsigned.apk
            android/app/build/outputs/apk/release/app-release-unsigned.apk.sha256
          if-no-files-found: error
